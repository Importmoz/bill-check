version: '3.8'

services:
  web:
    build: .
    container_name: bill-check-v2-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase-cgk4w0o8koocsg4wggsgg888.144.91.110.199.sslip.io}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - DATA_DIR=/app/data
    volumes:
      - bill_check_v2_data:/app/data
    restart: unless-stopped

volumes:
  bill_check_v2_data:
