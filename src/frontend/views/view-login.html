<div id="view-login" class="fixed inset-0 flex items-center justify-center z-[100] bg-gray-100">
        <div class="bg-white p-8 rounded-2xl border-2 border-gray-600 shadow-2xl w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="bg-black text-white w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 font-black text-3xl shadow-lg">
                    CTR</div>
            </div>
            <div class="space-y-4 text-black">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">E-mail de Acesso</label>
                    <input type="email" id="login-user" placeholder="seu@email.com" class="w-full p-3 border-2 border-gray-100 focus:border-black outline-none rounded-lg font-semibold bg-white transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-gray-400 mb-1">Palavra-passe</label>
                    <input type="password" id="login-pass" placeholder="********" class="w-full p-3 border-2 border-gray-100 focus:border-black outline-none rounded-lg font-semibold bg-white transition-all">
                </div>
                <button id="btn-login" onclick="handleLogin()" class="w-full bg-black text-white py-3 rounded-lg font-bold uppercase text-sm mt-4 hover:bg-gray-800 transition-all active:scale-95">Entrar</button>
            </div>
            <div id="login-error" class="mt-4 hidden">
                <div class="bg-red-50 p-3 rounded border border-red-200">
                    <p class="text-red-700 text-[10px] font-bold uppercase mb-1">Erro de Ligação:</p>
                    <p id="error-message" class="text-red-600 text-[10px] leading-tight"></p>
                    <p class="text-gray-400 text-[8px] mt-2 italic">* Verifique se o servidor PocketBase está online e
                        permite CORS.</p>
                </div>
            </div>
        </div>
    </div>
