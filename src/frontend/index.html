<!DOCTYPE html><html lang="pt-PT"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controlo | Duty &amp; Freight</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- SDK do PocketBase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.1/pocketbase.umd.js"></script>
    <!-- SheetJS para processamento de Excel/Sheets -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- OCR Support -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="/config.js"></script></head>

<body class="p-4 md:p-10 pb-24">
    <!-- Loader Global Premium -->
    <div id="loader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white/80 backdrop-blur-sm hidden transition-all duration-300">
        <div class="flex flex-col items-center gap-4">
            <div class="relative w-16 h-16">
                <div class="absolute inset-0 border-4 border-slate-100 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 animate-pulse">A Processar</span>
                <div class="flex gap-1 mt-1">
                    <div class="w-1 h-1 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                    <div class="w-1 h-1 bg-blue-600 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                    <div class="w-1 h-1 bg-blue-600 rounded-full animate-bounce"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recipiente Principal para as Views -->
    <div id="app-root"></div>

    <!-- Modais Globais -->
    <div id="modals-container"></div>


    <script type="module" src="js/app.js?v=20260511"></script>
</body></html>
